{% extends 'base.html' %}
{% load static %}

{% block contenido %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div class="card shadow-sm border-0">
                <div class="card-header text-white" style="background-color: #8B1D19;">
                    <h4 class="mb-0 fw-bold">{{ titulo }}</h4>
                </div>
                
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Completa los datos solicitados. Los campos marcados son obligatorios para el registro en el sistema.</p>
                    

                    <form method="POST">

                        {% csrf_token %}
                        

                        <div class="formulario-estilizado">
                            {{ form.as_p }}
                        </div>
                        
                        <hr class="mt-4 mb-4">
                        
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'listar_actividades' %}" class="btn btn-secondary fw-bold">Cancelar</a>
                            <button type="submit" class="btn btn-dark fw-bold">Guardar Registro</button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<style>
    .formulario-estilizado label {
        font-weight: bold;
        font-size: 14px;
        margin-top: 10px;
        color: #333;
    }
</style>
{% endblock %}
