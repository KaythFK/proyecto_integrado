{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Municipal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center min-vh-100" style="background-color: #ffffff;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                
                <div class="card text-center shadow-lg" style="background-color: #8B1D19; border: 3px solid black; color: white;">
                    <img src="{% static 'images/logo_blanco.png' %}" class="card-img-top p-4" alt="Logo">
                    
                    <div class="card-body mb-2">
                        <h5 class="card-title fw-bold">Delegaciones Municipales</h5>
                        <p class="card-text mb-4">Sistema de gestión municipal y control de actividades.</p>
                        
                        <form method="POST" action="{% url 'usuariosApp:login' %}">
                            {% csrf_token %}
                            
                            {% if messages %}
                                {% for message in messages %}
                                    <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-warning{% endif %} py-2 px-2 mb-3 text-dark text-start" role="alert">
                                        <small>{{ message }}</small>
                                    </div>
                                {% endfor %}
                            {% endif %}

                            <div class="mb-3 text-start">
                                <label for="username" class="form-label small fw-bold">Correo</label>
                                <input type="email" id="username" name="username" class="form-control" required>
                            </div>
                            
                            <div class="mb-4 text-start">
                                <label for="password" class="form-label small fw-bold">Contraseña</label>
                                <input type="password" id="password" name="password" class="form-control" required>
                            </div>
                            
                            <button type="submit" class="btn btn-dark w-100 fw-bold" style="border: 1px solid white;">Entrar al Sistema</button>
                        </form>

                        <a href="{% url 'usuariosApp:recuperar_clave' %}" class="d-block mt-3 small text-white">¿Olvidaste tu contraseña?</a>


                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
